<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, minimum-scale=1.0">
<meta name="theme-color" content="#000033">
<meta name="robots" content="noindex, nofollow">
<title>Redirecting - VortixWorld Luarmor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔄</text></svg>">
<style>
:root{
  --blue:#0066ff;
  --glow:rgba(0,102,255,0.7);
  --yellow:#ffd84d;
  --yellow-glow:rgba(255,216,77,0.12);
  --yellow-bg:rgba(255,216,77,0.06);
  --yellow-border:rgba(255,216,77,0.22);
  --red: #ff3366;
  --text-color: #fff;
  --bg-start: #000000;
  --bg-mid1: #000022;
  --bg-mid2: #000033;
  --bg-end: #000022;
  --bg-opacity: 0.3;
  --shadow-color: rgba(0,0,0,0.6);
  --loader-border: rgba(255,255,255,0.12);
  --loader-top: #ffffff;
  --countdown-shadow: rgba(255,255,255,0.4);
  --warning-shadow: rgba(0,0,0,0.55);
  --warning-shadow-mid: rgba(0,0,0,0.58);
  --link-color: var(--blue);
  --footer-space:clamp(56px,10vh,96px);
}
@media (prefers-color-scheme: light){
  :root{
    --text-color: #000;
    --bg-start: #ffffff;
    --bg-mid1: #f0f0ff;
    --bg-mid2: #e0e0ff;
    --bg-end: #f0f0ff;
    --bg-opacity: 0.5;
    --shadow-color: rgba(0,0,0,0.2);
    --loader-border: rgba(0,0,0,0.12);
    --loader-top: #000000;
    --countdown-shadow: rgba(0,0,0,0.4);
    --warning-shadow: rgba(0,0,0,0.25);
    --warning-shadow-mid: rgba(0,0,0,0.28);
    --yellow: #ccaa3d;
    --blue: #0044cc;
    --red: #cc2952;
  }
  .logo{color: #000000;}
  .count-label{opacity: .8;}
  .loader-ring{box-shadow:0 0 35px rgba(0,0,0,0.3),inset 0 0 20px rgba(0,102,255,0.3);}
  #countdown{text-shadow:0 4px 12px var(--countdown-shadow);}
}
@media print {
  body { background: white; color: black; }
  .loader-ring, .warning[style*="animation"] { display: none; }
}
*{box-sizing:border-box;margin:0;padding:0}
*:focus {outline:2px solid var(--blue); outline-offset:2px;}
html,body{height:100%}
body{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,var(--bg-start) 0%,var(--bg-mid1) 30%,var(--bg-mid2) 70%,var(--bg-end) 100%);
  background-size:400% 400%;
  animation:gradientShift 30s ease infinite;
  color:var(--text-color);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:20px;
  padding-bottom:var(--footer-space);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  will-change:background-position;
  hyphens:auto;
}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{
  width:100%;
  max-width:560px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(12px,3.5vw,32px);
  padding:clamp(14px,3.2vw,28px);
  text-align:center;
  box-shadow:0 20px 50px var(--shadow-color);
  border-radius:24px;
  background:rgba(0,0,0,var(--bg-opacity));
  backdrop-filter:blur(15px);
  contain:paint;
}
.logo{
  font-size:clamp(28px,6.8vw,56px);
  font-weight:700;
  letter-spacing:-1.6px;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
  color:var(--text-color);
  text-shadow:none;
  background:none;
}
.loader-ring{
  width:clamp(64px,12vw,96px);
  height:clamp(64px,12vw,96px);
  border:clamp(6px,1.5vw,10px) solid var(--loader-border);
  border-top-color:var(--loader-top);
  border-right-color:var(--blue);
  border-radius:50%;
  animation:spin 1.2s linear infinite;
  box-shadow:0 0 35px rgba(255,255,255,0.3),inset 0 0 20px rgba(0,102,255,0.3);
  flex-shrink:0;
  will-change:transform;
}
@keyframes spin{to{transform:rotate(360deg)}}
#countdown{
  font-size:clamp(48px,14vw,118px);
  font-weight:700;
  line-height:1;
  letter-spacing:-4px;
  margin-bottom:0;
  transition:all .28s ease;
  word-break:break-word;
  max-width:100%;
  display:block;
  text-shadow:0 4px 12px var(--countdown-shadow);
}
.count-label{
  font-size:clamp(13px,3.2vw,18px);
  font-weight:600;
  letter-spacing:2px;
  opacity:.9;
}
.warning{
  width:100%;
  max-width:540px;
  color:var(--yellow);
  background:var(--yellow-bg);
  border:1.2px solid var(--yellow-border);
  border-radius:16px;
  padding:16px 20px;
  font-size:clamp(13px,3.4vw,17px);
  font-weight:600;
  line-height:1.4;
  box-shadow:0 14px 35px var(--warning-shadow);
  backdrop-filter:blur(12px);
  word-break:break-word;
  hyphens:auto;
  animation:yellowGlow 6s cubic-bezier(0.4,0,0.2,1) infinite;
  transition:all 0.3s ease;
  will-change:box-shadow, background, filter;
}
@keyframes yellowGlow{
  0%{box-shadow:0 14px 35px var(--warning-shadow); background:rgba(255,216,77,0.06); filter:brightness(1)}
  50%{box-shadow:0 16px 40px var(--warning-shadow-mid),0 0 20px var(--yellow-glow); background:rgba(255,216,77,0.08); filter:brightness(1.03)}
  100%{box-shadow:0 14px 35px var(--warning-shadow); background:rgba(255,216,77,0.06); filter:brightness(1)}
}
.footer{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:env(safe-area-inset-bottom,0) + 16px;
  font-size:13.5px;
  opacity:.6;
  letter-spacing:1px;
  padding:6px 12px;
  pointer-events:none;
  background:transparent;
  transition:opacity 0.4s ease;
}
@media (max-width:420px){
  .logo{font-size:clamp(22px,8.5vw,34px)}
  #countdown{font-size:clamp(42px,18vw,86px)}
  .warning{padding:12px 14px;border-radius:12px}
  .container{padding:12px;gap:12px}
}
@media (orientation:landscape) and (max-height:520px){
  body{padding:12px;padding-bottom:var(--footer-space)}
  .container{gap:10px;max-width:720px;padding:12px}
  .logo{font-size:28px}
  #countdown{font-size:clamp(36px,12vw,64px)}
}
@media (prefers-reduced-motion:reduce){
  body, .loader-ring, .warning{animation:none}
}
</style>
</head>
<body>
<noscript>
  <div class="container">
    <p>Enable JavaScript to redirect automatically.</p>
  </div>
</noscript>
<main class="container" role="main">
  <div class="logo">VortixWorld Luarmor</div>
  <svg class="loader-ring" viewBox="0 0 100 100" aria-hidden="true" role="progressbar" aria-valuemin="0" aria-valuemax="25">
    <circle cx="50" cy="50" r="45" stroke="var(--loader-border)" stroke-width="10" fill="none"/>
    <circle cx="50" cy="50" r="45" stroke="var(--loader-top)" stroke-width="10" fill="none" stroke-dasharray="283" stroke-dashoffset="0" transform="rotate(-90 50 50)" style="animation: spin 1.2s linear infinite;"/>
  </svg>
  <div id="countdown" aria-live="polite" role="timer" aria-label="Redirect countdown">25</div>
  <div class="count-label">SECONDS UNTIL REDIRECT</div>
  <div class="warning" role="alert" lang="en">⚠️ Luarmor Might Blacklist Continue At Your Own Risk ⚠️</div>
  <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
  <progress id="progress" value="25" max="25" aria-hidden="true"></progress>
</main>
<div class="footer" role="contentinfo">VortixWorld • Luarmor 2026</div>
<script id="target-data" type="application/json" data-b64="%TARGET_B64%"></script>
<script>
try {
  function b64DecodeUnicode(s){
    if (!s) return '';
    try{
      return decodeURIComponent(Array.prototype.map.call(atob(s.replace(/-/g, '+').replace(/_/g, '/')),function(c){return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);}).join(''))
    }catch(e){
      return '';
    }
  }
  const b64=(document.getElementById('target-data')||{}).dataset?.b64||'';
  const TARGET_URL=b64?b64DecodeUnicode(b64):'';
  let timeLeft=25;
  let start = Date.now();
  const countdownEl=document.getElementById('countdown');
  const progressEl=document.getElementById('progress');
  const loaderEl = document.querySelector('.loader-ring');
  function tick() {
    timeLeft = 25 - Math.floor((Date.now() - start)/1000);
    countdownEl.textContent=timeLeft>=0?timeLeft:0;
    countdownEl.setAttribute('aria-valuenow', timeLeft >= 0 ? timeLeft : 0);
    countdownEl.setAttribute('aria-valuetext', (timeLeft >= 0 ? timeLeft : 0) + ' seconds remaining');
    if (progressEl) progressEl.value = 25 - (timeLeft >= 0 ? timeLeft : 0);
    if (loaderEl) loaderEl.setAttribute('aria-valuenow', timeLeft >= 0 ? timeLeft : 0);
    if(timeLeft<=8){
      countdownEl.style.color='var(--red)';
      countdownEl.style.transform='scale(1.12)';
      countdownEl.style.textShadow='0 6px 18px var(--red)';
    }else{
      countdownEl.style.color='';
      countdownEl.style.transform='';
      countdownEl.style.textShadow='0 4px 12px var(--countdown-shadow)';
    }
    if(timeLeft<=0){
      if(TARGET_URL&&TARGET_URL.trim().length>0){
        try{window.location.replace(TARGET_URL)}catch(err){window.location.href=TARGET_URL; console.warn('Redirect failed:', err);}
      }else{
        console.error('Redirect target empty; aborting.');
      }
    } else {
      requestAnimationFrame(tick);
    }
  }
  tick();
  if(TARGET_URL){
    try{
      const meta=document.createElement('meta');
      meta.httpEquiv="refresh";
      meta.content="25; url="+TARGET_URL;
      document.head.appendChild(meta);
    }catch(e){}
  }
  const footerEl = document.querySelector('.footer');
  if (footerEl) {
    footerEl.style.opacity = 1;
    footerEl.textContent = 'VortixWorld • Luarmor ' + new Date().getFullYear();
  }
  const themeToggle = document.getElementById('theme-toggle');
  if (themeToggle) {
    themeToggle.addEventListener('click', () => {
      document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
  }
  window.addEventListener('resize', () => {
    document.body.style.paddingBottom = getComputedStyle(document.documentElement).getPropertyValue('--footer-space');
  });
} catch(e) {
  console.error(e);
  if (TARGET_URL) {
    window.location.href = TARGET_URL;
  } else {
    window.location.href = '/';
  }
}
</script>
</body>
</html>
